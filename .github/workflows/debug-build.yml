name: Debug Build

on:
  push:
    branches:
      - chore/bootstrap-private-maintenance
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Initialize required Material Color Utilities submodule
        run: git submodule update --init --depth 1 material3/material-color-utilities

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Debug keystore
        shell: bash
        run: |
          if [[ ! -f app/debug.keystore ]]; then
            keytool -genkeypair \
              -keystore app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Run security regression tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests "me.rerere.rikkahub.data.ai.RequestLoggingInterceptorTest" \
            --tests "me.rerere.rikkahub.web.WebServerSecurityPolicyTest" \
            --tests "me.rerere.rikkahub.data.sync.BackupArchiveSecurityTest" \
            --tests "me.rerere.rikkahub.data.sync.AndroidSystemBackupRulesTest" \
            --tests "me.rerere.rikkahub.data.sync.BackupContainerTest" \
            --tests "me.rerere.rikkahub.data.sync.LocalBackupServiceTest"

      - name: Assemble Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orangechat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  api26-backup-crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Initialize required Material Color Utilities submodule
        run: git submodule update --init --depth 1 material3/material-color-utilities

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Debug keystore
        shell: bash
        run: |
          if [[ ! -f app/debug.keystore ]]; then
            keytool -genkeypair \
              -keystore app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Install official Android API 26 emulator image
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-26" \
            "system-images;android-26;google_apis;x86_64"
          echo "no" | avdmanager create avd \
            --force \
            --name orangechat-api26 \
            --package "system-images;android-26;google_apis;x86_64" \
            --device "pixel"

      - name: Run backup crypto compatibility test on API 26
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          sudo chmod 666 /dev/kvm
          emulator_log="$RUNNER_TEMP/orangechat-api26-emulator.log"
          emulator \
            -avd orangechat-api26 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -camera-back none \
            -camera-front none \
            >"$emulator_log" 2>&1 &
          emulator_pid=$!

          cleanup() {
            result=$?
            if [[ $result -ne 0 ]]; then
              adb devices || true
              adb shell getprop ro.build.version.sdk || true
              tail -n 200 "$emulator_log" || true
            fi
            adb emu kill >/dev/null 2>&1 || true
            kill "$emulator_pid" >/dev/null 2>&1 || true
            wait "$emulator_pid" >/dev/null 2>&1 || true
            exit "$result"
          }
          trap cleanup EXIT

          timeout 180 adb wait-for-device
          boot_completed=""
          for _ in $(seq 1 180); do
            boot_completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            [[ "$boot_completed" == "1" ]] && break
            sleep 2
          done
          [[ "$boot_completed" == "1" ]]

          api_level="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          abi="$(adb shell getprop ro.product.cpu.abi | tr -d '\r')"
          echo "Emulator API level: $api_level"
          echo "Emulator ABI: $abi"
          [[ "$api_level" == "26" ]]
          [[ "$abi" == "x86_64" ]]

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          ./gradlew :app:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=me.rerere.rikkahub.data.sync.BackupContainerAndroidCompatibilityTest
