name: Debug Build

on:
  push:
    branches:
      - chore/bootstrap-private-maintenance
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Initialize required Material Color Utilities submodule
        run: git submodule update --init --depth 1 material3/material-color-utilities

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Debug keystore
        shell: bash
        run: |
          if [[ ! -f app/debug.keystore ]]; then
            keytool -genkeypair \
              -keystore app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Run security regression tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests "me.rerere.rikkahub.data.ai.RequestLoggingInterceptorTest" \
            --tests "me.rerere.rikkahub.web.WebServerSecurityPolicyTest" \
            --tests "me.rerere.rikkahub.data.sync.BackupArchiveSecurityTest" \
            --tests "me.rerere.rikkahub.data.sync.AndroidSystemBackupRulesTest" \
            --tests "me.rerere.rikkahub.data.sync.BackupContainerTest" \
            --tests "me.rerere.rikkahub.data.sync.LocalBackupServiceTest"

      - name: Assemble Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orangechat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
