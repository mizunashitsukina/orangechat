name: Debug Build

on:
  push:
    branches:
      - chore/bootstrap-private-maintenance
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Initialize required Material Color Utilities submodule
        run: git submodule update --init --depth 1 material3/material-color-utilities

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare stable or ephemeral Debug signing
        id: debug-signing
        shell: bash
        env:
          CI_DEBUG_KEYSTORE_BASE64: ${{ secrets.CI_DEBUG_KEYSTORE_BASE64 }}
          CI_DEBUG_KEY_ALIAS: ${{ secrets.CI_DEBUG_KEY_ALIAS }}
          CI_DEBUG_STORE_PASSWORD: ${{ secrets.CI_DEBUG_STORE_PASSWORD }}
          CI_DEBUG_KEY_PASSWORD: ${{ secrets.CI_DEBUG_KEY_PASSWORD }}
          IS_FORK_PR: >-
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          present=0
          for value in \
            "$CI_DEBUG_KEYSTORE_BASE64" \
            "$CI_DEBUG_KEY_ALIAS" \
            "$CI_DEBUG_STORE_PASSWORD" \
            "$CI_DEBUG_KEY_PASSWORD"; do
            [[ -n "$value" ]] && present=$((present + 1))
          done

          if [[ "$present" -eq 4 ]]; then
            keystore_path="$RUNNER_TEMP/orangechat-ci-debug.jks"
            umask 077
            if ! printf '%s' "$CI_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"; then
              rm -f -- "$keystore_path"
              echo "::error::Failed to restore the dedicated CI Debug keystore."
              exit 1
            fi
            chmod 600 "$keystore_path"
            if ! keytool -list \
              -keystore "$keystore_path" \
              -storetype JKS \
              -storepass:env CI_DEBUG_STORE_PASSWORD \
              -alias "$CI_DEBUG_KEY_ALIAS" >/dev/null 2>&1; then
              rm -f -- "$keystore_path"
              echo "::error::The dedicated CI Debug keystore could not be validated."
              exit 1
            fi
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "keystore_path=$keystore_path" >> "$GITHUB_OUTPUT"
            echo "Using dedicated stable CI Debug signing."
          elif [[ "$present" -eq 0 && "$IS_FORK_PR" == "true" ]]; then
            keystore_path="$GITHUB_WORKSPACE/app/debug.keystore"
            keytool -genkeypair \
              -keystore "$keystore_path" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "keystore_path=$keystore_path" >> "$GITHUB_OUTPUT"
            echo "::warning::Fork PR build uses an ephemeral Debug signature;" \
              "its APK does not support stable overwrite installation."
          else
            echo "::error::Dedicated CI Debug signing secrets are incomplete or unavailable for this trusted build."
            exit 1
          fi

      - name: Run security regression tests
        env:
          CI_DEBUG_KEYSTORE_PATH: ${{ steps.debug-signing.outputs.keystore_path }}
          CI_DEBUG_KEY_ALIAS: ${{ secrets.CI_DEBUG_KEY_ALIAS }}
          CI_DEBUG_STORE_PASSWORD: ${{ secrets.CI_DEBUG_STORE_PASSWORD }}
          CI_DEBUG_KEY_PASSWORD: ${{ secrets.CI_DEBUG_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests "me.rerere.rikkahub.data.ai.RequestLoggingInterceptorTest" \
            --tests "me.rerere.rikkahub.web.WebServerSecurityPolicyTest" \
            --tests "me.rerere.rikkahub.data.sync.BackupArchiveSecurityTest" \
            --tests "me.rerere.rikkahub.data.sync.AndroidSystemBackupRulesTest" \
            --tests "me.rerere.rikkahub.data.sync.BackupContainerTest" \
            --tests "me.rerere.rikkahub.data.sync.LocalBackupServiceTest" \
            --tests "me.rerere.rikkahub.data.datastore.migration.SettingsJsonMigratorTest" \
            --tests "me.rerere.rikkahub.ui.pages.backup.tabs.BackupImportErrorMappingTest" \
            --tests "me.rerere.rikkahub.data.ai.mcp.LegacyMcpToolCompatibilityTest" \
            --tests "me.rerere.rikkahub.ui.components.ai.WorkspacePanelStateTest" \
            --tests "me.rerere.rikkahub.DisclaimerGateTest" \
            --tests "me.rerere.rikkahub.data.datastore.DisclaimerPersistenceTest" \
            --tests "me.rerere.rikkahub.data.service.FixedConversationBindingTest" \
            --tests "me.rerere.rikkahub.data.service.ProactiveRequestLayoutTest"
          ./gradlew :ai:testDebugUnitTest \
            --tests "me.rerere.ai.provider.providers.openai.ChatCompletionsAPIProactiveRequestTest"

      - name: Assemble Debug APK
        env:
          CI_DEBUG_KEYSTORE_PATH: ${{ steps.debug-signing.outputs.keystore_path }}
          CI_DEBUG_KEY_ALIAS: ${{ secrets.CI_DEBUG_KEY_ALIAS }}
          CI_DEBUG_STORE_PASSWORD: ${{ secrets.CI_DEBUG_STORE_PASSWORD }}
          CI_DEBUG_KEY_PASSWORD: ${{ secrets.CI_DEBUG_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify Debug APK identity and signing certificate
        id: verify-debug-signing
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "Android SDK root is unavailable." >&2
            exit 1
          fi
          apksigner="$(
            find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -print |
              sort -V |
              tail -n 1
          )"
          aapt="$(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt -print | sort -V | tail -n 1)"
          if [[ ! -x "$apksigner" || ! -x "$aapt" ]]; then
            echo "Official Android APK verification tools are unavailable." >&2
            exit 1
          fi

          mapfile -d '' apks < <(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print0)
          if [[ "${#apks[@]}" -eq 0 ]]; then
            echo "No Debug APK was produced." >&2
            exit 1
          fi

          fingerprints=()
          for apk in "${apks[@]}"; do
            "$apksigner" verify "$apk"
            fingerprint="$(
              "$apksigner" verify --print-certs "$apk" 2>&1 |
                sed -n 's/.*certificate SHA-256 digest:[[:space:]]*//p' |
                head -n 1
            )"
            application_id="$("$aapt" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
            if [[ -z "$fingerprint" ]]; then
              echo "Unable to read the Debug APK signing certificate fingerprint." >&2
              exit 1
            fi
            if [[ "$application_id" != "me.rerere.orangechat.debug" ]]; then
              echo "Unexpected Debug APK applicationId." >&2
              exit 1
            fi
            fingerprints+=("$fingerprint")
            echo "Debug APK certificate SHA-256: $fingerprint"
            echo "Debug APK applicationId verified: $application_id"
          done

          unique_fingerprints="$(printf '%s\n' "${fingerprints[@]}" | sort -u | wc -l | tr -d ' ')"
          if [[ "$unique_fingerprints" != "1" ]]; then
            echo "Debug APK splits are not signed by one certificate." >&2
            exit 1
          fi
          echo "certificate_sha256=${fingerprints[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            ${{ steps.debug-signing.outputs.stable == 'true' &&
            'orangechat-debug-apk' || 'orangechat-debug-apk-ephemeral-signing' }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary Debug signing material
        if: always()
        shell: bash
        run: |
          keystore_path="${{ steps.debug-signing.outputs.keystore_path }}"
          if [[ -n "$keystore_path" ]]; then
            rm -f -- "$keystore_path"
          fi

  api26-backup-crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Initialize required Material Color Utilities submodule
        run: git submodule update --init --depth 1 material3/material-color-utilities

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare stable or ephemeral Debug signing
        id: debug-signing
        shell: bash
        env:
          CI_DEBUG_KEYSTORE_BASE64: ${{ secrets.CI_DEBUG_KEYSTORE_BASE64 }}
          CI_DEBUG_KEY_ALIAS: ${{ secrets.CI_DEBUG_KEY_ALIAS }}
          CI_DEBUG_STORE_PASSWORD: ${{ secrets.CI_DEBUG_STORE_PASSWORD }}
          CI_DEBUG_KEY_PASSWORD: ${{ secrets.CI_DEBUG_KEY_PASSWORD }}
          IS_FORK_PR: >-
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          present=0
          for value in \
            "$CI_DEBUG_KEYSTORE_BASE64" \
            "$CI_DEBUG_KEY_ALIAS" \
            "$CI_DEBUG_STORE_PASSWORD" \
            "$CI_DEBUG_KEY_PASSWORD"; do
            [[ -n "$value" ]] && present=$((present + 1))
          done

          if [[ "$present" -eq 4 ]]; then
            keystore_path="$RUNNER_TEMP/orangechat-ci-debug.jks"
            umask 077
            if ! printf '%s' "$CI_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"; then
              rm -f -- "$keystore_path"
              echo "::error::Failed to restore the dedicated CI Debug keystore."
              exit 1
            fi
            chmod 600 "$keystore_path"
            if ! keytool -list \
              -keystore "$keystore_path" \
              -storetype JKS \
              -storepass:env CI_DEBUG_STORE_PASSWORD \
              -alias "$CI_DEBUG_KEY_ALIAS" >/dev/null 2>&1; then
              rm -f -- "$keystore_path"
              echo "::error::The dedicated CI Debug keystore could not be validated."
              exit 1
            fi
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "keystore_path=$keystore_path" >> "$GITHUB_OUTPUT"
            echo "Using dedicated stable CI Debug signing."
          elif [[ "$present" -eq 0 && "$IS_FORK_PR" == "true" ]]; then
            keystore_path="$GITHUB_WORKSPACE/app/debug.keystore"
            keytool -genkeypair \
              -keystore "$keystore_path" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "keystore_path=$keystore_path" >> "$GITHUB_OUTPUT"
            echo "::warning::Fork PR build uses an ephemeral Debug signature;" \
              "its APK does not support stable overwrite installation."
          else
            echo "::error::Dedicated CI Debug signing secrets are incomplete or unavailable for this trusted build."
            exit 1
          fi

      - name: Locate Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "Neither ANDROID_SDK_ROOT nor ANDROID_HOME is set." >&2
            exit 1
          fi

          sdkmanager_path="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            echo "Android SDK command-line tools are unavailable at the expected latest path." >&2
            if [[ -d "$sdk_root/cmdline-tools" ]]; then
              find "$sdk_root/cmdline-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort >&2
            else
              echo "The Android SDK cmdline-tools directory does not exist." >&2
            fi
            exit 1
          fi

          printf '%s\n' "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          printf '%s\n' "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          printf '%s\n' "$sdk_root/emulator" >> "$GITHUB_PATH"
          printf 'SDK_ROOT=%s\n' "$sdk_root" >> "$GITHUB_ENV"
          android_user_home="$RUNNER_TEMP/android-user-home"
          android_avd_home="$RUNNER_TEMP/android-avd"
          mkdir -p "$android_user_home" "$android_avd_home"
          printf 'ANDROID_USER_HOME=%s\n' "$android_user_home" >> "$GITHUB_ENV"
          printf 'ANDROID_AVD_HOME=%s\n' "$android_avd_home" >> "$GITHUB_ENV"
          "$sdkmanager_path" --version

      - name: Install official Android API 26 emulator image
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          set +e
          set +o pipefail
          yes | "$sdkmanager_path" --licenses >/dev/null
          license_status=$?
          set -e
          set -o pipefail
          if [[ $license_status -ne 0 ]]; then
            echo "Android SDK license acceptance failed." >&2
            exit "$license_status"
          fi
          "$sdkmanager_path" \
            "platform-tools" \
            "emulator" \
            "platforms;android-26" \
            "system-images;android-26;google_apis;x86_64"
          avdmanager_path="$SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          emulator_path="$SDK_ROOT/emulator/emulator"
          [[ -x "$avdmanager_path" ]]
          [[ -x "$emulator_path" ]]
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          echo "no" | "$avdmanager_path" create avd \
            --force \
            --name orangechat-api26 \
            --package "system-images;android-26;google_apis;x86_64" \
            --device "pixel"

          avd_list="$("$emulator_path" -list-avds)"
          printf '%s\n' "$avd_list"
          if ! grep -Fxq "orangechat-api26" <<< "$avd_list"; then
            echo "The API 26 AVD was not listed after creation." >&2
            find "$ANDROID_AVD_HOME" -mindepth 1 -maxdepth 2 -printf '%P\n' | sort >&2
            exit 1
          fi
          if [[ ! -f "$ANDROID_AVD_HOME/orangechat-api26.ini" ||
                ! -d "$ANDROID_AVD_HOME/orangechat-api26.avd" ]]; then
            echo "The API 26 AVD definition is incomplete in the configured AVD directory." >&2
            find "$ANDROID_AVD_HOME" -mindepth 1 -maxdepth 2 -printf '%P\n' | sort >&2
            exit 1
          fi

      - name: Run API 26 compatibility and database migration tests
        shell: bash
        env:
          CI_DEBUG_KEYSTORE_PATH: ${{ steps.debug-signing.outputs.keystore_path }}
          CI_DEBUG_KEY_ALIAS: ${{ secrets.CI_DEBUG_KEY_ALIAS }}
          CI_DEBUG_STORE_PASSWORD: ${{ secrets.CI_DEBUG_STORE_PASSWORD }}
          CI_DEBUG_KEY_PASSWORD: ${{ secrets.CI_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          sudo chmod 666 /dev/kvm
          emulator_path="$SDK_ROOT/emulator/emulator"
          avd_list="$("$emulator_path" -list-avds)"
          printf '%s\n' "$avd_list"
          if ! grep -Fxq "orangechat-api26" <<< "$avd_list"; then
            echo "The API 26 AVD is unavailable before emulator startup." >&2
            find "$ANDROID_AVD_HOME" -mindepth 1 -maxdepth 2 -printf '%P\n' | sort >&2
            exit 1
          fi
          [[ -f "$ANDROID_AVD_HOME/orangechat-api26.ini" ]]
          [[ -d "$ANDROID_AVD_HOME/orangechat-api26.avd" ]]
          emulator_log="$RUNNER_TEMP/orangechat-api26-emulator.log"
          "$emulator_path" \
            -avd orangechat-api26 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -camera-back none \
            -camera-front none \
            >"$emulator_log" 2>&1 &
          emulator_pid=$!

          cleanup() {
            result=$?
            if [[ $result -ne 0 ]]; then
              adb devices || true
              adb shell getprop ro.build.version.sdk || true
              tail -n 200 "$emulator_log" || true
            fi
            adb emu kill >/dev/null 2>&1 || true
            kill "$emulator_pid" >/dev/null 2>&1 || true
            wait "$emulator_pid" >/dev/null 2>&1 || true
            exit "$result"
          }
          trap cleanup EXIT

          timeout 180 adb wait-for-device
          boot_completed=""
          for _ in $(seq 1 180); do
            boot_completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            [[ "$boot_completed" == "1" ]] && break
            sleep 2
          done
          [[ "$boot_completed" == "1" ]]

          api_level="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          abi="$(adb shell getprop ro.product.cpu.abi | tr -d '\r')"
          echo "Emulator API level: $api_level"
          echo "Emulator ABI: $abi"
          [[ "$api_level" == "26" ]]
          [[ "$abi" == "x86_64" ]]

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          test_classes="me.rerere.rikkahub.data.sync.BackupContainerAndroidCompatibilityTest"
          test_classes+=",me.rerere.rikkahub.data.db.migrations.Migration_24_29_Test"
          test_classes+=",me.rerere.rikkahub.data.db.migrations.Migration_25_26_Test"
          ./gradlew :app:connectedDebugAndroidTest \
            "-Pandroid.testInstrumentationRunnerArguments.class=$test_classes"

          adb shell am instrument -w \
            -e class me.rerere.rikkahub.StartupConsentSeedTest \
            me.rerere.orangechat.debug.test/androidx.test.runner.AndroidJUnitRunner

          package_name="me.rerere.orangechat.debug"
          component="$package_name/me.rerere.rikkahub.RouteActivity"
          for run_number in $(seq 1 7); do
            adb logcat -c
            startup_output="$(adb shell am start -W -S -n "$component")"
            echo "STARTUP_RUN=$run_number"
            printf '%s\n' "$startup_output" | grep -E '^(LaunchState|ThisTime|TotalTime|WaitTime):'
            adb logcat -d -s OrangeStartupTiming:I | \
              sed -n 's/.*event=\([A-Za-z]*\) elapsedMs=\([0-9]*\).*/event=\1 elapsedMs=\2/p'
          done

      - name: Remove temporary Debug signing material
        if: always()
        shell: bash
        run: |
          keystore_path="${{ steps.debug-signing.outputs.keystore_path }}"
          if [[ -n "$keystore_path" ]]; then
            rm -f -- "$keystore_path"
          fi
